spring:
  application:
    name: ecommerce-backend
  profiles:
    active: dev
  cloud:
    gcp:
      vertex:
        ai:
          gemini:
            chat:
              model-name: gemini-2.5-flash
  datasource:
    url: jdbc:h2:mem:ecommerce-db
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      "[hibernate.format_sql]": true
      "[hibernate.jdbc.time_zone]": UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  h2:
    console:
      enabled: true
      path: /h2-console

gemini:
  api:
    key: ${GEMINI_API_KEY}

server:
  forward-headers-strategy: framework
  port: ${PORT:10000}
  address: 0.0.0.0
  error:
    include-message: always

logging:
  level:
    root: INFO
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
    "[org.springframework.security]": INFO

# -------------------------
# JWT Configuration
# -------------------------
security:
  jwt:
    secret: ${JWT_SECRET:mysecretkey}
    expiration: 3600000
    refresh-expiration: 86400000

# -------------------------
# Swagger / OpenAPI
# -------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: public
      paths-to-match: /health, /api/**
    - group: admin
      paths-to-match: /actuator/**